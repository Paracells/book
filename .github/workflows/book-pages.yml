name: Build and deploy the book

on:
  push:
    branches:
      - master
      - ru-update-2026
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory=bin
          echo "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the book
        run: mdbook build rustbook-ru

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rustbook-ru/book

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Ветка должна быть разрешена в Settings → Environments → github-pages →
    # Deployment branches and tags. Иначе GitHub отклонит деплой с ошибкой
    # "Branch ... is not allowed to deploy to github-pages".
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
